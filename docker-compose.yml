services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: ami-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Local_2026!}
      # Developer es gratuita para desarrollo y test no productivo.
      MSSQL_PID: Developer
      MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./infra/sql:/scripts:ro
    healthcheck:
      # El contenedor responde antes de que el motor acepte conexiones. Sin este
      # healthcheck, la carga de datos falla de forma intermitente y parece un
      # problema de red cuando en realidad es una carrera de arranque.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD:-Dev_Local_2026!}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ami-api
    env_file:
      - .env
    # OJO — estas tres van con valor FIJO y NO con ${VAR:-default}.
    #
    # Compose interpola ${VAR} contra el .env del proyecto, así que un
    # `${OLLAMA_HOST:-http://host.docker.internal:11434}` NUNCA usa ese
    # default: toma el `http://localhost:11434` del .env, que adentro del
    # container apunta al container mismo. El default parece una red de
    # seguridad y es exactamente lo contrario.
    #
    # La regla, entonces: las variables que describen CÓMO LLEGAR a otro
    # servicio valen distinto adentro y afuera de Docker. El .env describe
    # correr la API a mano (localhost); el compose las pisa acá. Las
    # credenciales sí vienen del .env vía env_file — esas no cambian.
    environment:
      # `sqlserver` es el nombre del SERVICIO: dentro de la red de compose
      # ese es el hostname. Y es MSSQL_SERVER, no MSSQL_DSN — core/db.py
      # arma la cadena de conexión a mano en `_cadena()` y lee esta.
      # (MSSQL_DSN figura en env.example pero no la lee nadie en el código.)
      MSSQL_SERVER: sqlserver,1433
      # Ollama NO entra a este compose (ver README y ADR-010): es un
      # requisito de la máquina host, no un servicio del sistema.
      # host.docker.internal es cómo Docker expone el host al container.
      OLLAMA_HOST: http://host.docker.internal:11434
      # Adentro de Docker el análisis va a la cola y lo consume el worker
      # (ADR-012). El default del código sigue siendo `memoria`, que es lo
      # que corre cuando se levanta la API a mano con tasks.ps1.
      JOBS_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      # No-op en Docker Desktop (ya resuelve host.docker.internal solo).
      # Necesario en Linux nativo para que el mismo compose ande igual ahí.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # El índice FAISS y la caché de embeddings de HuggingFace NO viajan en
      # la imagen (ver Dockerfile): son datos generados, no código. Sin este
      # volumen, cargar_indice() devuelve None y el agente degrada solo a
      # análisis sin evidencia documental — no hace falta nada más acá.
      - indice_data:/app/data/indice
      - hf_cache:/root/.cache/huggingface
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: ami-redis
    # appendonly yes: la cola sobrevive a un reinicio del contenedor. Sin
    # esto, Redis guarda solo snapshots periódicos y un reinicio en el
    # momento equivocado pierde justo los jobs encolados — que es
    # exactamente el agujero que este servicio vino a tapar.
    command: redis-server --appendonly yes
    ports:
      # Publicado por el mismo motivo que el 1433 de SQL Server: los tests
      # marcados `redis` corren FUERA de Docker, contra el venv local, y sin
      # el puerto expuesto se saltearían siempre — un test que nunca corre
      # da la misma señal que uno que no existe.
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ami-worker
    # Misma imagen que la API, distinto comando. No hay un Dockerfile
    # aparte a propósito: worker y API comparten TODO el código —el grafo,
    # las tools, el almacén— y dos imágenes que tienen que quedar en sincro
    # es una que en algún momento no lo está.
    command: ["python", "-m", "apps.jobs.worker"]
    env_file:
      - .env
    environment:
      MSSQL_SERVER: sqlserver,1433
      OLLAMA_HOST: http://host.docker.internal:11434
      JOBS_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Los MISMOS volúmenes que la API: el worker es quien corre el grafo,
      # así que es el que necesita el índice FAISS y el modelo de embeddings.
      - indice_data:/app/data/indice
      - hf_cache:/root/.cache/huggingface
    # El HEALTHCHECK de la imagen le pega a http://localhost:8000/health, y
    # este contenedor NO sirve HTTP: heredarlo lo dejaría `unhealthy` para
    # siempre. Se reemplaza por la pregunta que sí tiene sentido acá —
    # ¿este worker está registrado y vivo para RQ?—, que es lo que Redis ya
    # sabe por el heartbeat que el worker manda solo.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          from rq import Worker
          from apps.api.store_redis import _cliente
          c = _cliente(decodificar=False)
          sys.exit(0 if Worker.all(connection=c) else 1)
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
  indice_data:
  hf_cache:
  redis_data:
