# CI — linter + tipos + tests. Deliberadamente NO corre lo que necesita
# SQL Server (marca `db`) ni lo que llama al modelo real (marca `llm`,
# ya excluida por default en pyproject.toml). Levantar SQL Server en el
# runner es una ampliación real de este workflow, no una que se hizo acá:
# ver docs/adr/ADR-011-ci-github-actions.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Redis sí entra al pipeline y SQL Server no, y la diferencia no es
    # arbitraria: esta imagen levanta en segundos y no necesita esquema ni
    # datos sembrados, así que los tests marcados `redis` corren de verdad
    # en vez de saltearse. SQL Server pediría healthcheck, `db-init` y el
    # seed completo — eso sigue pendiente (ADR-011).
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # Pinneado a la versión COMPLETA y no a `@v10`, que no existe: desde su
      # v8 esta acción dejó de publicar tags mayores y menores a propósito
      # ("pinning to major releases opens up users to supply chain attacks"), y
      # sus releases son inmutables. `@v10` da 404, no un fallback silencioso.
      #
      # El salto de v5 a v10 cruza cuatro breaking changes, y ninguno nos toca:
      #   v6  `activate-environment` — solo aplica si se usa el input
      #       `python-version`, que acá no se usa: Python se instala en el paso
      #       siguiente. Y el default de `cache-dependency-glob` cambió, pero
      #       este workflow lo fija explícito.
      #   v7  node20 -> node24, y se removió `server-url`, que no usábamos.
      #   v8  se dejaron de publicar los tags mayores (ver arriba).
      #   v9  `prune-cache` pasa a false por default: más cache, no otro
      #       comportamiento.
      #   v10 con `enable-cache: auto` se desactiva el cache en
      #       `pull_request_target`, `workflow_run` y `release` para evitar cache
      #       poisoning. Acá está en `true` explícito, así que no cambia nada.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python 3.13
        run: uv python install 3.13

      # --all-extras: la suite toca los cinco grupos opcionales (rag y ml
      # los importan los tests de esos módulos, seed lo usa el generador de
      # datos sintéticos que consumen esos mismos tests). --frozen: falla si
      # el lock no coincide con pyproject.toml, el mismo criterio que ya usa
      # el Dockerfile (ADR-010) y por el mismo motivo — no resolver versiones
      # distintas de las que el golden set tiene medidas.
      - name: Instalar dependencias
        run: uv sync --frozen --all-extras --group dev

      # Los tests marcados `rag` (ver pyproject.toml) cargan el modelo real
      # de embeddings — sin él en cache, HF_HUB_OFFLINE=1 (default, ver
      # rag/indice.py) los hace fallar con "no se pudo cargar el modelo",
      # no con un error de red. Se cachea por nombre de modelo: no cambia
      # entre commits, así que la descarga real pasa una sola vez.
      - name: Cache del modelo de embeddings
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-intfloat-multilingual-e5-small-v1

      - name: Descargar el modelo de embeddings si no está en cache
        run: |
          export HF_HUB_OFFLINE=0
          uv run python -c "from rag.indice import obtener_modelo; obtener_modelo()"

      - name: Linter (ruff)
        run: uv run ruff check .

      - name: Tipos (mypy strict)
        run: uv run mypy .

      - name: Tests (sin SQL Server, sin modelo real)
        run: uv run pytest -m "not db" -q
