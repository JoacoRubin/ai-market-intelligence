# CI — linter + tipos + tests rápidos, más un job separado que verifica los
# permisos reales del usuario SQL read-only. El modelo de lenguaje sigue fuera:
# una inferencia local de minutos no pertenece al feedback loop de cada commit.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Redis entra en este job porque levanta en segundos y no necesita datos.
    # El bind se limita al loopback del runner efímero; el Compose del proyecto
    # no publica Redis al host.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # Pinneado a la versión COMPLETA y no a `@v10`, que no existe: desde su
      # v8 esta acción dejó de publicar tags mayores y menores a propósito
      # ("pinning to major releases opens up users to supply chain attacks"), y
      # sus releases son inmutables. `@v10` da 404, no un fallback silencioso.
      #
      # El salto de v5 a v10 cruza cuatro breaking changes, y ninguno nos toca:
      #   v6  `activate-environment` — solo aplica si se usa el input
      #       `python-version`, que acá no se usa: Python se instala en el paso
      #       siguiente. Y el default de `cache-dependency-glob` cambió, pero
      #       este workflow lo fija explícito.
      #   v7  node20 -> node24, y se removió `server-url`, que no usábamos.
      #   v8  se dejaron de publicar los tags mayores (ver arriba).
      #   v9  `prune-cache` pasa a false por default: más cache, no otro
      #       comportamiento.
      #   v10 con `enable-cache: auto` se desactiva el cache en
      #       `pull_request_target`, `workflow_run` y `release` para evitar cache
      #       poisoning. Acá está en `true` explícito, así que no cambia nada.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python 3.13
        run: uv python install 3.13

      # --all-extras: la suite toca los cinco grupos opcionales (rag y ml
      # los importan los tests de esos módulos, seed lo usa el generador de
      # datos sintéticos que consumen esos mismos tests). --frozen: falla si
      # el lock no coincide con pyproject.toml, el mismo criterio que ya usa
      # el Dockerfile (ADR-010) y por el mismo motivo — no resolver versiones
      # distintas de las que el golden set tiene medidas.
      - name: Instalar dependencias
        run: uv sync --frozen --all-extras --group dev

      # Los tests marcados `rag` (ver pyproject.toml) cargan el modelo real
      # de embeddings — sin él en cache, HF_HUB_OFFLINE=1 (default, ver
      # rag/indice.py) los hace fallar con "no se pudo cargar el modelo",
      # no con un error de red. Se cachea por nombre de modelo: no cambia
      # entre commits, así que la descarga real pasa una sola vez.
      - name: Cache del modelo de embeddings
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-intfloat-multilingual-e5-small-v1

      - name: Descargar el modelo de embeddings si no está en cache
        run: |
          export HF_HUB_OFFLINE=0
          uv run python -c "from rag.indice import obtener_modelo; obtener_modelo()"

      - name: Linter (ruff)
        run: uv run ruff check .

      - name: Tipos (mypy strict)
        run: uv run mypy .

      # Baseline medido el 2026-08-28 sobre esta misma selección y estos nueve
      # paquetes: 71,06%. Se fija 70%, con un punto de tolerancia por plataforma;
      # no es un número aspiracional puesto después de mirar un badge.
      - name: Tests y cobertura (sin SQL Server, sin modelo real)
        run: >-
          uv run pytest -m "not db and not llm" -q
          --cov=agent --cov=application --cov=apps --cov=core --cov=eval
          --cov=ml --cov=rag --cov=replay --cov=seeds
          --cov-report=term-missing --cov-fail-under=70

  guardrails-db:
    runs-on: ubuntu-latest
    env:
      MSSQL_SERVER: localhost,1433
      MSSQL_DB: ami
      MSSQL_SA_PASSWORD: Dev_CI_Only_2026!
      MSSQL_APP_USER: ami_reader
      MSSQL_APP_PASSWORD: Reader_Local_2026!

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Dev_CI_Only_2026!
        ports:
          - 127.0.0.1:1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dev_CI_Only_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar Python 3.13
        run: uv python install 3.13

      # Secuencia oficial de Microsoft para Ubuntu. El runner necesita el
      # driver ODBC; sqlcmd ya vive dentro del contenedor de SQL Server.
      - name: Instalar ODBC Driver 18
        run: |
          version_id="$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)"
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/${version_id}/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Instalar dependencias mínimas de test
        run: uv sync --frozen --group dev

      - name: Crear esquema y usuario read-only
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          docker cp infra/sql/01_schema.sql "${SQL_CONTAINER}:/tmp/01_schema.sql"
          docker cp infra/sql/02_readonly_user.sql "${SQL_CONTAINER}:/tmp/02_readonly_user.sql"
          docker exec "${SQL_CONTAINER}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -i /tmp/01_schema.sql
          docker exec "${SQL_CONTAINER}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -i /tmp/02_readonly_user.sql

      - name: Guardrails de permisos SQL
        run: uv run pytest tests/test_db_guardrails.py -m db -q
