[project]
name = "ai-market-intelligence"
version = "0.1.0"
description = "Plataforma de inteligencia comercial asistida por IA: agente LangGraph que orquesta SQL, RAG, fuentes públicas y modelos predictivos para producir informes trazables."
readme = "README.md"
requires-python = "==3.13.*"

# Núcleo mínimo: API + contratos + orquestación del agente.
# Deliberadamente chico. Cada dependencia extra vive en un grupo opcional,
# para que el repo se pueda levantar por partes y las fases sean incrementales.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "sqlalchemy>=2.0.51",
    "pyodbc>=5.3",
    "langgraph>=1.2",
    # LangChain no orquesta nada acá: eso es de LangGraph (ADR-001). Está solo
    # para el segundo adaptador del puerto ClienteLLM (ADR-007), que es lo que
    # deja abierta la salida a otros proveedores sin tocar los nodos.
    "langchain>=1.3",
    "langchain-ollama>=1.0",
    # Observability del agente (ADR-009). Ya viajaba transitiva de
    # langchain-core sin que nada la usara — lo mismo que ADR-007 corrigió con
    # langchain antes de este ADR. Se declara porque ahora `@traceable`
    # instrumenta los tres adaptadores de ClienteLLM. Sin LANGSMITH_TRACING=true
    # el decorador es no-op: no pega a la red, no rompe tests, no cuesta nada.
    "langsmith>=0.10",
]

[project.optional-dependencies]
# Fase 4 — forecast, anomalías y experiment tracking.
# pandas queda fijado a <3: mlflow todavía no soporta pandas 3.x. Es la
# restricción real del ecosistema, no una preferencia. Revisar al actualizar mlflow.
ml = [
    "scikit-learn>=1.9",
    "pandas>=2.2,<3",
    "numpy>=2.5",
    "mlflow>=3.15",
]
# Fase 3 — índice vectorial y embeddings locales.
# Pesado (arrastra torch, ~2 GB). Por eso está separado del core.
rag = [
    "faiss-cpu>=1.15",
    "sentence-transformers>=5.7",
    "pypdf>=6.0",
]
# Fase 1 — generación del dataset sintético con seed reproducible.
# Mismo pin de pandas que el grupo ml, para que ambos grupos convivan.
seed = [
    "faker>=37.0",
    "numpy>=2.5",
    "pandas>=2.2,<3",
]
# Exportación del informe a PDF.
# ReportLab y no WeasyPrint: WeasyPrint necesita GTK/Pango nativos que no vienen
# en el wheel y no están disponibles en Windows. Verificado, no supuesto.
report = [
    "reportlab>=5.0",
    "matplotlib>=3.11",
]
anthropic = [
    "anthropic>=0.75",
]
# Fase 6 — cola de trabajos y almacén compartido entre procesos (ADR-012).
# Opcional a propósito: con JOBS_BACKEND=memoria (default) el sistema corre
# entero sin Redis, que es lo que mantiene la suite sin infraestructura y el
# repo levantable con pocos comandos.
#
# RQ y no Celery: el código de este proyecto es síncrono y `ejecutar_grafo`
# también. Celery traería broker abstracto, result backend y serializers para
# resolver lo mismo — es el criterio de ADR-001, la arquitectura justifica el
# framework y no al revés.
jobs = [
    "redis>=5.2",
    "rq>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.15",
    # Para auditar el contenido del PDF generado desde los tests: sin esto,
    # solo se podría verificar que el archivo existe, no qué dice.
    "pypdf>=6.0",
    "httpx2>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Los evals contra el modelo real quedan fuera de la corrida por defecto:
# tardan minutos en CPU y se corren cuando se toca el prompt o el modelo,
# no en cada commit. Se invocan con: pytest -m llm
addopts = "-q --strict-markers -m 'not llm'"
markers = [
    "slow: pruebas que invocan al LLM local (segundos a minutos)",
    "db: requieren SQL Server levantado",
    "eval: corren contra el golden set",
    "llm: invocan al modelo de lenguaje real (lentos: minutos en CPU)",
    "rag: cargan el modelo de embeddings y calculan vectores (~20s)",
    "redis: requieren un Redis levantado (docker compose up -d redis)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# B008 prohíbe llamadas en los valores por defecto de los argumentos, porque el
# objeto se crea una sola vez y se comparte entre invocaciones. En FastAPI ese
# es justamente el mecanismo de inyección de dependencias y los objetos son
# inmutables, así que la advertencia no aplica. Se declara la excepción en vez
# de esparcir `noqa` por cada endpoint.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
# Sin esto mypy entra a los entornos virtuales y reporta errores de código
# ajeno. El patrón cubre .venv del proyecto y venvs externos (~/.venvs/...),
# y no ancla en ^ porque mypy resuelve rutas absolutas.
exclude = [
    "[\\\\/]\\.?venvs?[\\\\/]",
    "[\\\\/](build|dist)[\\\\/]",
    # mypy resuelve este a un nombre de módulo sin separadores, así que los
    # patrones de ruta de arriba no lo agarran. Es el script de activación de
    # un virtualenv, no código del proyecto.
    "activate_this\\.py$",
]

# Librerías de terceros que no publican tipos (sin py.typed ni stubs oficiales).
# Se silencia el import y NO se instalan paquetes de stubs a propósito: los
# stubs de pandas y reportlab arrastran decenas de errores que discuten con las
# opiniones de quien los escribió, no con la correctitud de este código. El
# valor de mypy acá está en las fronteras propias, no en re-tipar dependencias.
[[tool.mypy.overrides]]
module = [
    "pyodbc.*",
    "pandas.*",
    "reportlab.*",
    "sklearn.*",
    "faiss.*",
    "sentence_transformers.*",
    "mlflow.*",
    "matplotlib.*",
    "faker.*",
    "pypdf.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Se agregan a medida que existen. Declarar paquetes inexistentes rompe el build.
packages = ["seeds", "core"]
